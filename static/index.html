<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luna Voice Assistant</title>
    <!-- Premium Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Plus+Jakarta+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #07050f 0%, #020105 100%);
            --glass-bg: rgba(255, 255, 255, 0.02);
            --glass-border: rgba(255, 255, 255, 0.05);
            --neon-blue: #00f2fe;
            --neon-purple: #9b51e0;
            --neon-pink: #ff007f;
            --neon-green: #39ff14;
            --neon-orange: #ff9f00;
            --text-primary: #f8f9fa;
            --text-secondary: rgba(248, 249, 250, 0.5);
            
            --orb-color: var(--neon-blue);
            --orb-glow: rgba(0, 242, 254, 0.3);
        }

        /* Status-specific configurations */
        body.status-initializing {
            --orb-color: #f1c40f;
            --orb-glow: rgba(241, 196, 15, 0.3);
        }
        body.status-calibrating {
            --orb-color: var(--neon-orange);
            --orb-glow: rgba(255, 159, 0, 0.3);
        }
        body.status-idle {
            --orb-color: rgba(255, 255, 255, 0.15);
            --orb-glow: rgba(255, 255, 255, 0.02);
        }
        body.status-listening {
            --orb-color: var(--neon-pink);
            --orb-glow: rgba(255, 0, 127, 0.4);
        }
        body.status-processing {
            --orb-color: var(--neon-purple);
            --orb-glow: rgba(155, 81, 224, 0.4);
        }
        body.status-speaking {
            --orb-color: var(--neon-blue);
            --orb-glow: rgba(0, 242, 254, 0.4);
        }
        body.status-error {
            --orb-color: var(--neon-pink);
            --orb-glow: rgba(255, 0, 127, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Slowly floating vibrant background blobs */
        .blob-1 {
            position: absolute;
            width: 700px;
            height: 700px;
            background: radial-gradient(circle, rgba(155, 81, 224, 0.1) 0%, rgba(0,0,0,0) 70%);
            top: -100px;
            left: -150px;
            z-index: 0;
            pointer-events: none;
            animation: float-blob-1 25s infinite alternate ease-in-out;
        }
        
        .blob-2 {
            position: absolute;
            width: 800px;
            height: 800px;
            background: radial-gradient(circle, rgba(0, 242, 254, 0.08) 0%, rgba(0,0,0,0) 70%);
            bottom: -200px;
            right: -150px;
            z-index: 0;
            pointer-events: none;
            animation: float-blob-2 30s infinite alternate ease-in-out;
        }

        @keyframes float-blob-1 {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(120px, 80px) scale(1.15); }
        }

        @keyframes float-blob-2 {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(-100px, -60px) scale(0.9); }
        }

        .dashboard-container {
            position: relative;
            z-index: 1;
            width: 96vw;
            height: 92vh;
            max-width: 1440px;
            display: grid;
            grid-template-columns: 400px 1fr;
            gap: 28px;
            background: rgba(8, 6, 16, 0.35);
            backdrop-filter: blur(35px);
            -webkit-backdrop-filter: blur(35px);
            border: 1px solid var(--glass-border);
            border-radius: 28px;
            padding: 28px;
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.7);
        }

        /* Sidebar - Chat Panel */
        .sidebar {
            display: flex;
            flex-direction: column;
            height: 100%;
            border-right: 1px solid var(--glass-border);
            padding-right: 28px;
            overflow: hidden;
        }

        .sidebar-header {
            margin-bottom: 24px;
        }

        .sidebar-header h2 {
            font-family: 'Outfit', sans-serif;
            font-size: 24px;
            font-weight: 600;
            letter-spacing: 0.5px;
            background: linear-gradient(90deg, #ffffff, var(--text-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .chat-console {
            flex: 1;
            overflow-y: auto;
            padding-right: 10px;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            scrollbar-width: thin;
            scrollbar-color: rgba(255, 255, 255, 0.08) transparent;
        }

        .chat-console::-webkit-scrollbar {
            width: 4px;
        }
        
        .chat-console::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }

        .chat-bubble {
            max-width: 85%;
            padding: 14px 20px;
            border-radius: 20px;
            line-height: 1.6;
            font-size: 14.5px;
            position: relative;
            animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            word-wrap: break-word;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .chat-bubble.user {
            align-self: flex-end;
            background: linear-gradient(135deg, rgba(155, 81, 224, 0.15) 0%, rgba(155, 81, 224, 0.04) 100%);
            border: 1px solid rgba(155, 81, 224, 0.25);
            border-bottom-right-radius: 4px;
            color: #fff;
            box-shadow: 0 4px 15px rgba(155, 81, 224, 0.05);
        }

        .chat-bubble.luna {
            align-self: flex-start;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-bottom-left-radius: 4px;
            color: var(--text-primary);
        }

        /* Streaming dynamic typing cursor indicator */
        .chat-bubble.luna.typing::after {
            content: '▊';
            animation: blink 0.8s infinite;
            color: var(--neon-blue);
            margin-left: 4px;
            font-size: 12px;
        }

        @keyframes blink {
            50% { opacity: 0; }
        }

        .connection-status {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 12px;
            color: var(--text-secondary);
            padding: 10px 14px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            width: fit-content;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--neon-pink);
            box-shadow: 0 0 8px var(--neon-pink);
        }

        .status-dot.connected {
            background: var(--neon-green);
            box-shadow: 0 0 8px var(--neon-green);
        }

        /* Main Workspace */
        .main-workspace {
            display: grid;
            grid-template-rows: 1fr 190px;
            gap: 24px;
            height: 100%;
            overflow: hidden;
        }

        /* Visualizer Panel containing fluid Siri/Alexa visualizer */
        .visualizer-panel {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        .assistant-title {
            position: absolute;
            top: 32px;
            text-align: center;
            z-index: 10;
        }

        .assistant-title h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 32px;
            font-weight: 800;
            letter-spacing: 2px;
            background: linear-gradient(90deg, #ffffff 40%, var(--neon-blue) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
        }

        .assistant-title p {
            font-size: 11px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--text-secondary);
        }

        /* Wavy Orb Container holding canvas and central glass core */
        .orb-container {
            position: relative;
            width: 440px;
            height: 440px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #visualizerCanvas {
            position: absolute;
            z-index: 1;
            pointer-events: none;
            transition: all 0.5s ease;
        }

        .orb-center-label {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            z-index: 10;
        }

        .luna-name {
            font-family: 'Outfit', sans-serif;
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 4px;
            color: #fff;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.4);
        }

        .luna-state {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            margin-top: 6px;
            color: var(--orb-color);
            text-shadow: 0 0 10px var(--orb-glow);
            transition: color 0.5s ease, text-shadow 0.5s ease;
        }

        /* Logs / Timeline Panel */
        .logs-panel {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 20px 24px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .logs-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        .logs-header h3 {
            font-family: 'Outfit', sans-serif;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 0.5px;
            color: var(--text-secondary);
        }

        .action-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            scrollbar-width: thin;
        }

        .action-list::-webkit-scrollbar {
            width: 4px;
        }

        .action-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.015);
            border: 1px solid var(--glass-border);
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 13px;
            animation: fadeIn 0.3s ease;
        }

        .action-details {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .action-name {
            font-weight: 600;
            color: #fff;
        }

        .action-arg {
            font-family: monospace;
            color: var(--neon-blue);
            background: rgba(0, 242, 254, 0.08);
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 12px;
        }

        .action-status {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            padding: 3px 10px;
            border-radius: 8px;
        }

        .action-status.running {
            background: rgba(255, 159, 0, 0.12);
            color: var(--neon-orange);
            border: 1px solid rgba(255, 159, 0, 0.25);
            animation: pulse-border 1.0s infinite alternate;
        }

        .action-status.success {
            background: rgba(57, 255, 20, 0.08);
            color: var(--neon-green);
            border: 1px solid rgba(57, 255, 20, 0.25);
        }

        .action-status.failed {
            background: rgba(255, 0, 127, 0.08);
            color: var(--neon-pink);
            border: 1px solid rgba(255, 0, 127, 0.25);
        }

        @keyframes pulse-border {
            0% { opacity: 0.6; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body class="status-initializing">
    <!-- Ambient aesthetics -->
    <div class="blob-1"></div>
    <div class="blob-2"></div>

    <div class="dashboard-container">
        <!-- Chat Side Console -->
        <div class="sidebar">
            <div class="sidebar-header">
                <h2>Conversation History</h2>
            </div>
            
            <div class="chat-console" id="chatConsole">
                <!-- Loaded dynamically -->
            </div>

            <div class="connection-status">
                <div class="status-dot" id="statusDot"></div>
                <span id="connectionText">Connecting to backend...</span>
            </div>
        </div>

        <!-- Main Workspace -->
        <div class="main-workspace">
            <!-- Center Visualizer -->
            <div class="visualizer-panel">
                <div class="assistant-title">
                    <h1>LUNA</h1>
                    <p>Voice Intelligence Cockpit</p>
                </div>

                <!-- Circular voice visualizer container -->
                <div class="orb-container">
                    <canvas id="visualizerCanvas" width="440" height="440"></canvas>
                    <div class="orb-center-label">
                        <span class="luna-name">LUNA</span>
                        <span class="luna-state" id="statusText">Initializing</span>
                    </div>
                </div>
            </div>

            <!-- Action Timeline Console -->
            <div class="logs-panel">
                <div class="logs-header">
                    <h3>Actions Execution Log</h3>
                </div>
                <div class="action-list" id="actionList">
                    <!-- Logs populated dynamically -->
                    <div class="action-row" style="background: none; border: none; justify-content: center; color: var(--text-secondary);">
                        No actions executed in this session yet.
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Client Script -->
    <script>
        const chatConsole = document.getElementById('chatConsole');
        const actionList = document.getElementById('actionList');
        const statusText = document.getElementById('statusText');
        const statusDot = document.getElementById('statusDot');
        const connectionText = document.getElementById('connectionText');
        const canvas = document.getElementById('visualizerCanvas');
        const ctx = canvas.getContext('2d');

        let ws;
        let lastLunaBubble = null;
        let phase = 0;

        // Visualizer config representing status values
        let visualizerConfig = {
            radius: 130,
            amplitude: 4,
            frequency: 6,
            speed: 0.04,
            colors: ['#00f2fe', '#9b51e0']
        };

        function updateVisualizer(status) {
            switch (status) {
                case 'listening':
                    visualizerConfig.radius = 135;
                    visualizerConfig.amplitude = 14;
                    visualizerConfig.frequency = 7;
                    visualizerConfig.speed = 0.12;
                    visualizerConfig.colors = ['#ff007f', '#ff9f00', '#00f2fe'];
                    break;
                case 'processing':
                    visualizerConfig.radius = 130;
                    visualizerConfig.amplitude = 6;
                    visualizerConfig.frequency = 12;
                    visualizerConfig.speed = 0.22;
                    visualizerConfig.colors = ['#9b51e0', '#ff007f'];
                    break;
                case 'speaking':
                    visualizerConfig.radius = 130;
                    visualizerConfig.amplitude = 18; // will fluctuate dynamically
                    visualizerConfig.frequency = 6;
                    visualizerConfig.speed = 0.08;
                    visualizerConfig.colors = ['#00f2fe', '#39ff14', '#9b51e0'];
                    break;
                case 'calibrating':
                    visualizerConfig.radius = 125;
                    visualizerConfig.amplitude = 8;
                    visualizerConfig.frequency = 10;
                    visualizerConfig.speed = 0.16;
                    visualizerConfig.colors = ['#ff9f00', '#f1c40f'];
                    break;
                case 'idle':
                default:
                    visualizerConfig.radius = 120;
                    visualizerConfig.amplitude = 2;
                    visualizerConfig.frequency = 4;
                    visualizerConfig.speed = 0.02;
                    visualizerConfig.colors = ['rgba(255, 255, 255, 0.2)', 'rgba(0, 242, 254, 0.15)'];
                    break;
            }
        }

        // Draw voice visualizer loop (fluid circular wave)
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            
            phase += visualizerConfig.speed;
            
            let currentAmp = visualizerConfig.amplitude;
            const isSpeaking = document.body.className.includes('status-speaking');
            
            if (isSpeaking) {
                // Fluctuate amplitude dynamically based on sine wave to simulate vocal modulation
                currentAmp = visualizerConfig.amplitude * (0.3 + 0.7 * Math.sin(phase * 1.5));
            }
            
            // Draw overlapping wavy circular ripples
            for (let i = 0; i < visualizerConfig.colors.length; i++) {
                ctx.beginPath();
                const color = visualizerConfig.colors[i];
                const localPhase = phase + (i * Math.PI / 2.5);
                
                for (let angle = 0; angle <= Math.PI * 2; angle += 0.02) {
                    const ripple = currentAmp * Math.sin(visualizerConfig.frequency * angle + localPhase);
                    const r = visualizerConfig.radius + ripple;
                    const x = centerX + r * Math.cos(angle);
                    const y = centerY + r * Math.sin(angle);
                    
                    if (angle === 0) {
                        ctx.moveTo(x, y);
                    } else {
                        ctx.lineTo(x, y);
                    }
                }
                
                ctx.closePath();
                ctx.strokeStyle = color;
                ctx.lineWidth = 4 - (i * 0.8);
                ctx.shadowBlur = 18;
                ctx.shadowColor = color;
                ctx.stroke();
            }
            
            // Draw a center glassmorphic core inside the canvas
            ctx.beginPath();
            ctx.arc(centerX, centerY, visualizerConfig.radius - 18, 0, Math.PI * 2);
            ctx.shadowBlur = 0; // Clear blur for clean core shape
            const gradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, visualizerConfig.radius - 18);
            gradient.addColorStop(0, 'rgba(15, 12, 28, 0.65)');
            gradient.addColorStop(1, 'rgba(7, 5, 12, 0.95)');
            ctx.fillStyle = gradient;
            ctx.fill();
            
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.06)';
            ctx.lineWidth = 1;
            ctx.stroke();
            
            requestAnimationFrame(draw);
        }

        // Start WebSocket setup
        function connect() {
            const proto = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUri = `${proto}//${window.location.host}/ws`;
            
            console.log(`Connecting to WebSocket: ${wsUri}`);
            ws = new WebSocket(wsUri);

            ws.onopen = () => {
                console.log('Connected to backend');
                statusDot.classList.add('connected');
                connectionText.textContent = 'Connected to Luna Backend';
            };

            ws.onclose = () => {
                console.log('Disconnected from backend. Retrying in 2s...');
                statusDot.classList.remove('connected');
                connectionText.textContent = 'Disconnected. Reconnecting...';
                document.body.className = 'status-idle';
                statusText.textContent = 'Offline';
                updateVisualizer('idle');
                setTimeout(connect, 2000);
            };

            ws.onmessage = (event) => {
                const message = JSON.parse(event.data);
                handleMessage(message);
            };
        }

        function handleMessage(msg) {
            switch (msg.type) {
                case 'status':
                    updateStatus(msg.data);
                    break;
                case 'chat_start':
                    lastLunaBubble = document.createElement('div');
                    lastLunaBubble.className = 'chat-bubble luna typing';
                    chatConsole.appendChild(lastLunaBubble);
                    scrollToBottom();
                    break;
                case 'token':
                    if (lastLunaBubble) {
                        lastLunaBubble.textContent += msg.text;
                        scrollToBottom();
                    }
                    break;
                case 'chat':
                    if (msg.sender === 'luna' && lastLunaBubble) {
                        lastLunaBubble.classList.remove('typing');
                        lastLunaBubble.textContent = msg.text;
                        lastLunaBubble = null;
                    } else {
                        const bubble = document.createElement('div');
                        bubble.className = `chat-bubble ${msg.sender}`;
                        bubble.textContent = msg.text;
                        chatConsole.appendChild(bubble);
                    }
                    scrollToBottom();
                    break;
                case 'history':
                    chatConsole.innerHTML = '';
                    msg.data.forEach(item => {
                        const bubble = document.createElement('div');
                        bubble.className = `chat-bubble ${item.sender}`;
                        bubble.textContent = item.text;
                        chatConsole.appendChild(bubble);
                    });
                    scrollToBottom();
                    break;
                case 'action':
                    updateActionRow(msg);
                    break;
            }
        }

        function updateStatus(status) {
            document.body.className = `status-${status}`;
            statusText.textContent = status;
            updateVisualizer(status);
        }

        function updateActionRow(action) {
            const rowId = `action-${action.name}-${action.arg}`.replace(/[^a-zA-Z0-9-]/g, '');
            let row = document.getElementById(rowId);
            
            if (actionList.children.length === 1 && actionList.children[0].style.justifyContent === 'center') {
                actionList.innerHTML = '';
            }

            if (!row) {
                row = document.createElement('div');
                row.id = rowId;
                row.className = 'action-row';
                row.innerHTML = `
                    <div class="action-details">
                        <span>[ACTION]</span>
                        <span class="action-name">${action.name}</span>
                        <span class="action-arg">${action.arg}</span>
                    </div>
                    <span class="action-status ${action.status}">${action.status}</span>
                `;
                actionList.insertBefore(row, actionList.firstChild);
            } else {
                const statusBadge = row.querySelector('.action-status');
                statusBadge.className = `action-status ${action.status}`;
                statusBadge.textContent = action.status;
                if (action.result) {
                    row.title = action.result;
                }
            }
        }

        function scrollToBottom() {
            chatConsole.scrollTop = chatConsole.scrollHeight;
        }

        // Start drawing visualizer and connect
        draw();
        connect();
    </script>
</body>
</html>
